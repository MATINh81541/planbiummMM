# PlanBium — nginx SPA configuration example
#
# Place this in your nginx server block. Adjust root to point at the
# directory containing the built dist/ output.

server {
    listen 80;
    server_name planbium.ir;
    root /var/www/planbium/dist;

    # Gzip compression for text assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Long-cache hashed static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: serve index.html for any route not matching a static file
    location / {
        try_files $uri /index.html;
    }
}
